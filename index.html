<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Словарь</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<meta name="theme-color" content="#E8EAE3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161E" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Словарь">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
</head>
<body>

<!-- ============ СЛОВАРЬ ============ -->
<section class="view" id="view-dict">
  <header class="masthead">
    <div class="eyebrow"><b id="gFirst"></b><b id="gLast"></b></div>
    <div class="searchrow">
      <input id="q" type="search" placeholder="Найти слово" autocomplete="off"
             autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="search">
      <button class="iconbtn" id="clear" hidden aria-label="Очистить поиск">✕</button>
    </div>
    <div class="toolbar">
      <span id="count"></span>
      <button class="pill" id="rand">Наугад</button>
    </div>
  </header>
  <nav class="rail" id="rail" aria-label="Указатель по буквам"></nav>
  <main id="list"></main>
</section>

<!-- ============ КУРС ============ -->
<section class="view" id="view-course" hidden>
  <header class="masthead">
    <div class="eyebrow"><b>Курс</b><b id="courseStat"></b></div>
    <h1 class="h1" id="courseTitle">Курс</h1>
    <p class="sub" id="courseSub"></p>
  </header>
  <div class="pad" id="courseBody"></div>
</section>

<!-- ============ ПОВТОР ============ -->
<section class="view" id="view-review" hidden>
  <header class="masthead">
    <div class="eyebrow"><b>Повтор</b><b id="lessonStat"></b></div>
    <h1 class="h1" id="lessonTitle">Занятие на сегодня</h1>
    <p class="sub" id="lessonSub"></p>
  </header>
  <div class="pad" id="lessonBody"></div>
</section>

<!-- ============ ТЕСТ ============ -->
<section class="view" id="view-test" hidden>
  <header class="masthead">
    <div class="eyebrow"><b>Тест</b><b id="testStat"></b></div>
    <h1 class="h1">Проверка слов</h1>
    <p class="sub" id="testSub">Выберите направление перевода</p>
  </header>
  <div class="pad" id="testBody"></div>
</section>

<!-- ============ ЕЩЁ: правила и материалы ============ -->
<section class="view" id="view-more" hidden>
  <header class="masthead">
    <div class="eyebrow"><b>Ещё</b><b id="rulesCount"></b></div>
    <h1 class="h1">Правила и материалы</h1>
    <p class="sub">Справочник по грамматике и внешние источники</p>
  </header>
  <div class="pad">
    <div class="cat">Грамматика</div>
    <div id="rulesBody"></div>
    <div id="moreBody"></div>
  </div>
</section>

<!-- ============ ПАНЕЛЬ ============ -->
<nav class="tabbar" id="tabbar">
  <button data-v="dict" class="on">
    <svg viewBox="0 0 24 24"><path d="M4 4h10a3 3 0 013 3v13H7a3 3 0 01-3-3z"/><path d="M17 7h3v13H7"/></svg>
    Словарь</button>
  <button data-v="course">
    <svg viewBox="0 0 24 24"><path d="M12 5v15"/><path d="M3 5h6a3 3 0 013 3"/><path d="M21 5h-6a3 3 0 00-3 3"/><path d="M3 5v13h6"/><path d="M21 5v13h-6"/></svg>
    Курс</button>
  <button data-v="review">
    <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.3-5.6"/><path d="M20 4v4h-4"/></svg>
    Повтор</button>
  <button data-v="test">
    <svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M9 10h6"/><path d="M9 14h4"/></svg>
    Тест</button>
  <button data-v="more">
    <svg viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M4 12h10"/><path d="M4 18h13"/></svg>
    Ещё</button>
</nav>

<script src="app.js"></script>
<script src="course.js"></script>
</body>
</html>
